<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
</head>
<body>

<h2>Payment Page</h2>

Amount:
<input type="number" id="amount"><br><br>

<button onclick="pay()">Pay</button>

<p id="msg"></p>

<script>
function pay() {
    let amount = document.getElementById("amount").value;

    document.getElementById("msg").innerHTML =
        "Payment of ₹" + amount + " Successful";
}
</script>

</body>
</html>
